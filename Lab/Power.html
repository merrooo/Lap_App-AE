<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>حسابات القدرة - النظام المتكامل للحسابات الكهربائية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>

  <style>
    :root {
      --primary-color: #004a99;
      --secondary-color: #0099ff;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-light: #7f8c8d;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      --border-radius: 12px;
      --success: #27ae60;
      --danger: #e74c3c;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Cairo", system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
    }

    .app-wrapper {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      padding: 15px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===== TOP NAV ===== */
    .top-nav {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 0.85rem 1.25rem;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-brand {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      font-weight: 700;
    }

    .home-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .home-btn:hover {
      background: white;
      color: var(--primary-color);
    }

    /* ===== CARDS & SECTIONS ===== */
    .section-container {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-title {
      font-size: clamp(1rem, 3.2vw, 1.2rem);
      font-weight: 800;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title ion-icon {
      font-size: 1.3rem;
    }

    .subsection {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .subsection:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .subsection h4 {
      color: var(--text-main);
      margin-bottom: 12px;
      font-size: clamp(0.9rem, 2.8vw, 1rem);
      font-weight: 700;
    }

    /* ===== INPUTS & DASHBOARD ===== */
    .input-dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .input-group label {
      font-size: clamp(0.72rem, 2.2vw, 0.8rem);
      font-weight: 700;
      color: var(--text-light);
    }

    .input-group input,
    .input-group select {
      padding: 8px 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      background: #f8fafc;
      transition: all 0.3s ease;
      width: 100%;
    }

    .input-group input:focus,
    .input-group select:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(0, 153, 255, 0.1);
    }

    /* ===== RESULTS DASHBOARD ===== */
    .results-dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .result-item {
      padding: 10px 12px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid transparent;
      background: #f8fafc;
    }

    .result-label {
      font-size: clamp(0.72rem, 2.2vw, 0.8rem);
      color: var(--text-light);
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .res-val {
      font-size: clamp(0.9rem, 2.8vw, 1.1rem);
      font-weight: 700;
      color: var(--text-main);
      font-family: monospace;
    }

    .res-val.editable {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 4px 6px;
      text-align: center;
      width: 100%;
      display: block;
    }

    .grey-box {
      background: #f7fafc;
      border-color: var(--border);
    }

    .blue-box {
      background: #ebf8ff;
      border-color: #bee3f8;
    }

    /* ===== BUTTONS ===== */
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      transition: all 0.3s ease;
    }

    .btn-reset {
      background: #ff4757;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    /* ===== SCROLL BUTTONS ===== */
    .scroll-buttons {
      position: fixed;
      bottom: 15px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    .scroll-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--primary-color);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
    }

    .scroll-btn:hover {
      transform: scale(1.08);
      background: var(--secondary-color);
    }

    @media (max-width: 600px) {
      .main-content { padding: 8px; }
      .section-container { padding: 12px; border-radius: 10px; }
      .top-nav { padding: 0.65rem 0.85rem; border-radius: 10px; }
      .input-dashboard { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
    }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <div class="main-content">
      <nav class="top-nav">
        <div class="nav-brand">حسابات القدرة (Power)</div>
        <button class="home-btn" onclick="window.location.href='index.html'">
          <ion-icon name="arrow-up-outline"></ion-icon>
          <span>الصفحة الرئيسية</span>
        </button>
      </nav>

      <div class="section-container">
        <div class="section-header">
          <h3 class="section-title">
            <ion-icon name="calculator-outline"></ion-icon> حسابات القدرة
          </h3>
          <button class="btn-reset" onclick="resetCalibrations()">
            Reset All
          </button>
        </div>

        <!-- Phase Parameters -->
        <div class="subsection">
          <h4>📊 Phase Parameters (البيانات الكهربائية)</h4>
          <div class="input-dashboard">
            <div class="input-group">
              <label>System Mode</label>
              <select id="phase_mode" onchange="handlePhaseModeChange()">
                <option value="3">Three Phase (3Φ)</option>
                <option value="1">Single Phase (1Φ)</option>
              </select>
            </div>
            <div class="input-group">
              <label>Voltage (V)</label>
              <input type="number" id="v" value="380" oninput="calculatePhase()" />
            </div>
            <div class="input-group">
              <label>Current (A)</label>
              <input type="number" id="i" value="10" oninput="calculatePhase()" />
            </div>
            <div class="input-group">
              <label>Angle θ (°)</label>
              <input type="number" id="theta_phase" value="0" oninput="calculatePhase()" />
            </div>
          </div>
          <div class="results-dashboard">
            <div class="result-item grey-box">
              <span class="result-label">P.F</span>
              <input id="res_pf" class="res-val editable" type="text" inputmode="decimal" value="0.866" />
            </div>
            <div class="result-item grey-box">
              <span class="result-label">Active (kW)</span>
              <span id="res_kw" class="res-val" contenteditable="true">5.70</span>
            </div>
            <div class="result-item grey-box">
              <span class="result-label">H.P</span>
              <span id="res_hp" class="res-val" contenteditable="true">7.64</span>
            </div>
          </div>
        </div>

        <!-- Calibration Setup -->
        <div class="subsection">
          <h4>🛠️ Calibration Setup</h4>
          <div class="input-dashboard">
            <div class="input-group">
              <label>kWh Const</label>
              <input type="number" id="kwh_c" value="0" oninput="calculatePhase()" />
            </div>
            <div class="input-group">
              <label>kVARH Const</label>
              <input type="number" id="kvar_c" value="0" oninput="calculatePhase()" />
            </div>
            <div class="input-group">
              <label>Time (Min)</label>
              <input type="number" id="t_c" value="1" oninput="calculatePhase()" />
            </div>
          </div>
          <div class="results-dashboard">
            <div class="result-item blue-box">
              <span class="result-label">Required Current (kWh)</span>
              <span id="cal_kw" class="res-val">0.0</span>
            </div>
            <div class="result-item blue-box">
              <span class="result-label">Required Current (kVAR)</span>
              <span id="cal_kv" class="res-val">0.0</span>
            </div>
          </div>
        </div>

        <!-- AC Calculation -->
        <div class="subsection">
          <h4>❄️ A.C Calculation (حسابات التكييف)</h4>
          <div class="input-dashboard">
            <div class="input-group">
              <label>BTU/H</label>
              <input type="number" id="btu" value="12000" oninput="calcAC()" />
            </div>
            <div class="input-group">
              <label>Tons/Reg</label>
              <input type="number" id="tons" value="1" oninput="calcAC()" />
            </div>
            <div class="input-group">
              <label>Room L (m)</label>
              <input type="number" id="l" value="4" oninput="calcAC()" />
            </div>
            <div class="input-group">
              <label>Room W (m)</label>
              <input type="number" id="w" value="5" oninput="calcAC()" />
            </div>
            <div class="input-group">
              <label>Room H (m)</label>
              <input type="number" id="h" value="3" oninput="calcAC()" />
            </div>
          </div>
          <div class="results-dashboard">
            <div class="result-item grey-box">
              <span class="result-label">Result H.P</span>
              <span id="ac_hp_res" class="res-val">1.50</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="scroll-buttons">
    <button class="scroll-btn" onclick="scrollToTop()">▲</button>
    <button class="scroll-btn" onclick="scrollToBottom()">▼</button>
  </div>

  <script>
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function scrollToBottom() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const thetaInput = document.getElementById("theta_phase");
      const pfElem = document.getElementById("res_pf");
      const kwElem = document.getElementById("res_kw");
      const hpElem = document.getElementById("res_hp");
      const HP_TO_KW = 0.746;

      const getVal = (el) => {
        const raw = (el && "value" in el ? el.value : el.innerText || "")
          .trim()
          .replace(/,/g, ".");
        const match = raw.match(/-?\d+(\.\d+)?/);
        return match ? parseFloat(match[0]) : 0;
      };

      pfElem.addEventListener("input", () => {
        let pf = getVal(pfElem);
        if (pf > 1) pf = 1;
        if (pf < -1) pf = -1;
        const radians = Math.acos(pf);
        const degrees = radians * (180 / Math.PI);
        thetaInput.value = degrees.toFixed(1);
        calculatePhase();
      });

      hpElem.addEventListener("input", () => {
        const hp = getVal(hpElem);
        const kw = hp * HP_TO_KW;
        kwElem.innerText = kw.toFixed(2);
      });

      kwElem.addEventListener("input", () => {
        const kw = getVal(kwElem);
        const hp = kw / HP_TO_KW;
        hpElem.innerText = hp.toFixed(2);
      });
    });

    function handlePhaseModeChange() {
      const mode = document.getElementById("phase_mode").value;
      const voltageInput = document.getElementById("v");
      voltageInput.value = mode === "3" ? "380" : "220";
      calculatePhase();
    }

    function calculatePhase() {
      const mode = document.getElementById("phase_mode").value;
      const vline = parseFloat(document.getElementById("v").value) || 0;
      const vphase = 220;
      const i = parseFloat(document.getElementById("i").value) || 0;
      const theta = parseFloat(document.getElementById("theta_phase").value) || 0;
      const kc = parseFloat(document.getElementById("kwh_c").value) || 0;
      const kvc = parseFloat(document.getElementById("kvar_c").value) || 0;
      const tc = parseFloat(document.getElementById("t_c").value) || 0;
      const rad = (theta * Math.PI) / 180;
      const pf = Math.cos(rad);
      const sinA = Math.sin(rad);
      let kw = 0;

      if (mode === "1") {
        kw = (vphase * i * pf) / 1000;
      } else {
        kw = (Math.sqrt(3) * vline * i * pf) / 1000;
      }

      const hp = kw / 0.746;

      const resPfEl = document.getElementById("res_pf");
      const isEditingPf = document.activeElement === resPfEl;
      if (resPfEl && !isEditingPf) {
        if ("value" in resPfEl) resPfEl.value = pf.toFixed(3);
        else resPfEl.innerText = pf.toFixed(3);
      }
      document.getElementById("res_kw").innerText = kw.toFixed(2);
      document.getElementById("res_hp").innerText = hp.toFixed(2);

      if (tc > 0) {
        let cal_kw = 0;
        if (mode === "1") {
          cal_kw = ((kc * 60) / (vphase * tc)) * 1000;
        } else {
          cal_kw = ((kc * 60) / (Math.sqrt(3) * vline * pf * tc)) * 1000;
        }
        document.getElementById("cal_kw").innerText = cal_kw.toFixed(2);
      }

      if (tc > 0 && sinA !== 0 && mode === "3") {
        const cal_kv = ((kvc * 60) / (Math.sqrt(3) * vline * sinA * tc)) * 1000;
        document.getElementById("cal_kv").innerText = cal_kv.toFixed(2);
      }
    }

    function calcAC() {
      const btu = parseFloat(document.getElementById("btu").value) || 0;
      const tons = parseFloat(document.getElementById("tons").value) || 0;
      const l = parseFloat(document.getElementById("l").value) || 0;
      const w = parseFloat(document.getElementById("w").value) || 0;
      const h = parseFloat(document.getElementById("h").value) || 0;
      let res = 0;

      if (btu > 0) res = btu / 8000;
      else if (tons > 0) res = tons * 1.5;
      else if (l > 0 && w > 0 && h > 0) res = (300 * l * w * h) / 12000;

      document.getElementById("ac_hp_res").innerText = res.toFixed(2);
    }

    function resetCalibrations() {
      document.getElementById("v").value = "380";
      document.getElementById("i").value = "10";
      document.getElementById("theta_phase").value = "30";
      document.getElementById("kwh_c").value = "400";
      document.getElementById("kvar_c").value = "400";
      document.getElementById("t_c").value = "1";
      handlePhaseModeChange();
    }

    window.onload = function () {
      handlePhaseModeChange();
      calculatePhase();
      calcAC();
    };
  </script>
</body>

</html>
